<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>自营控制台</title>
  <style>
    html,body {height:100%;margin:0;background:#f4f6fa;font:16px system-ui,sans-serif;color:#182235}
    iframe {width:100%;height:100%;border:0}
    #loading {position:absolute;inset:0;text-align:center;align-content:center;padding:24px}
    button {padding:10px 18px;border:1px solid #c6cfde;border-radius:8px;background:white;font:inherit;cursor:pointer}
  </style>
  <script>window.CONSOLE_TUNNEL = "https://suggestions-improvements-museum-pins.trycloudflare.com";</script>
</head>
<body>
  <main id="loading"><p id="status" role="status">正在连接自营控制台…</p>
    <button type="button" id="retry">重新连接</button>
  </main>
  <iframe id="console" title="自营控制台" allow="clipboard-write; fullscreen"
    sandbox="allow-scripts allow-same-origin allow-forms allow-downloads allow-popups allow-popups-to-escape-sandbox" hidden></iframe>
  <script>
    const frame = document.getElementById('console');
    const loading = document.getElementById('loading');
    const statusText = document.getElementById('status');
    const source = 'https://raw.githubusercontent.com/Underbobo/self-operated-console/main/index.html';
    let attempt = 0;
    let timer;

    async function currentTunnel() {
      try {
        const response = await fetch(source + '?t=' + Date.now(), {
          cache: 'no-store', signal: AbortSignal.timeout(6000)
        });
        if (response.ok) {
          const match = (await response.text()).match(/window\.CONSOLE_TUNNEL\s*=\s*"(https:\/\/[a-z0-9-]+\.trycloudflare\.com)"\s*;/);
          if (match) return match[1];
        }
      } catch {}
      return window.CONSOLE_TUNNEL;
    }

    async function connect() {
      const current = ++attempt;
      frame.hidden = true;
      loading.hidden = false;
      statusText.textContent = '正在连接自营控制台…';
      clearTimeout(timer);
      const tunnel = await currentTunnel();
      if (current !== attempt) return;
      if (!tunnel) {
        statusText.textContent = '暂时无法连接，请稍后重试。';
        return;
      }
      frame.src = tunnel + '/' + location.search + location.hash;
      timer = setTimeout(() => {
        statusText.textContent = '连接时间较长，请点击重新连接。';
      }, 20000);
    }

    frame.addEventListener('load', () => {
      if (!frame.hasAttribute('src')) return;
      clearTimeout(timer);
      frame.hidden = false;
      loading.hidden = true;
    });
    document.getElementById('retry').addEventListener('click', connect);
    window.addEventListener('hashchange', connect);
    connect();
  </script>
</body>
</html>
